<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn Page — Kết nối Facebook</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .grant-wrap { max-width: 640px; margin: 40px auto; }
  .grant-card { background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(20,40,90,.14); overflow: hidden; }
  .grant-head { background: linear-gradient(135deg, #1877f2, #0d5cc0); color: #fff; padding: 22px 26px; }
  .grant-head h1 { margin: 0; font-size: 20px; }
  .grant-head p { margin: 6px 0 0; opacity: .92; font-size: 13.5px; }
  .grant-body { padding: 20px 26px 26px; }
  .page-row { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border: 1px solid #e6ebf3; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: all .15s; background: #fff; }
  .page-row:hover { border-color: #1877f2; box-shadow: 0 4px 14px rgba(24,119,242,.12); transform: translateY(-1px); }
  .page-row .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #1877f2, #42b883); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; flex-shrink: 0; }
  .page-row .info { flex: 1; }
  .page-row .pname { font-weight: 700; font-size: 15px; }
  .page-row .pid { font-size: 12px; color: var(--muted); }
  .page-row input[type=checkbox] { width: 22px; height: 22px; accent-color: #1877f2; cursor: pointer; }
  .grant-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-fb { background: #1877f2; border-color: #1877f2; color: #fff; font-weight: 700; padding: 11px 22px; font-size: 15px; border-radius: 10px; }
  .btn-fb:hover { background: #0d5cc0; }
  .result-row { padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; }
  .result-row.ok { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .result-row.fail { background: #fef2f2; border: 1px solid #fca5a5; }
</style>
</head>
<body data-page="settings">
<main class="page">
  <div class="grant-wrap">
    <div class="grant-card">
      <div class="grant-head">
        <h1>🔗 Kết nối Facebook thành công</h1>
        <p>Tìm thấy <b>{{ page_count }}</b> page do tài khoản này quản lý. Tick chọn page bạn cho phép ShopDesk sử dụng (kiểu Sapo: cấp quyền từng page).</p>
      </div>
      <div class="grant-body">
        <div id="pageList"><div class="state-loading"><span class="spinner"></span>Đang tải danh sách page…</div></div>
        <div id="resultBox" style="margin-top:14px"></div>
        <div class="grant-actions" id="actionBar">
          <button class="btn" id="btnAll">Chọn tất cả</button>
          <button class="btn btn-fb" id="btnSave">✅ Lưu các page đã chọn</button>
          <a class="btn" href="/settings" style="margin-left:auto">Về Cài đặt</a>
        </div>
      </div>
    </div>
  </div>
</main>
<div id="toastRoot"></div>
<script src="/static/js/common.js"></script>
<script>
(function () {
  "use strict";
  const KEY = {{ fb_key | tojson }};
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function load() {
    const box = document.getElementById("pageList");
    try {
      const j = await api("/api/connect/facebook/pages?key=" + encodeURIComponent(KEY));
      const pages = j.pages || [];
      if (!pages.length) {
        box.innerHTML = '<div class="state-empty">Tài khoản này không quản lý page nào (hoặc thiếu quyền). Thử lại với tài khoản admin page.</div>';
        return;
      }
      box.innerHTML = pages.map((p) => `
        <label class="page-row">
          <span class="avatar">${esc((p.name || "?").trim().charAt(0).toUpperCase())}</span>
          <span class="info"><span class="pname">${esc(p.name)}</span><br><span class="pid">ID: ${esc(p.page_id)}</span></span>
          <input type="checkbox" value="${esc(p.page_id)}" checked>
        </label>`).join("");
    } catch (e) {
      box.innerHTML = `<div class="state-error">⚠️ ${esc(e.message)}</div>`;
    }
  }

  document.getElementById("btnAll").addEventListener("click", () => {
    document.querySelectorAll('#pageList input[type=checkbox]').forEach((c) => c.checked = true);
  });

  document.getElementById("btnSave").addEventListener("click", async () => {
    const ids = [...document.querySelectorAll('#pageList input[type=checkbox]:checked')].map((c) => c.value);
    const res = document.getElementById("resultBox");
    if (!ids.length) { res.innerHTML = '<div class="result-row fail">⚠️ Chưa chọn page nào.</div>'; return; }
    const btn = document.getElementById("btnSave");
    btn.disabled = true; btn.textContent = "⏳ Đang lưu…";
    try {
      const j = await api("/api/connect/facebook/save", {
        method: "POST", body: JSON.stringify({ key: KEY, page_ids: ids }),
      });
      res.innerHTML = (j.results || []).map((r) => r.ok
        ? `<div class="result-row ok">✅ <b>${esc(r.name || r.page_id)}</b> — đã thêm vào ShopDesk, token kiểm tra OK.</div>`
        : `<div class="result-row fail">❌ <b>${esc(r.name || r.page_id)}</b> — ${esc(r.error_vi || "lỗi")}</div>`
      ).join("") + '<div style="margin-top:12px"><a class="btn btn-fb" href="/">📥 Về Inbox xem page mới</a></div>';
      document.getElementById("actionBar").style.display = "none";
    } catch (e) {
      res.innerHTML = `<div class="result-row fail">⚠️ ${esc(e.message)}</div>`;
      btn.disabled = false; btn.textContent = "✅ Lưu các page đã chọn";
    }
  });

  load();
})();
</script>
</body>
</html>
