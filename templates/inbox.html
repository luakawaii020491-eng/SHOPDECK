<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — ShopDesk</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  /* ===== Inbox 3 khung kiểu Sapo: danh sách | hội thoại | thông tin KH ===== */
  .inbox3 { display: grid; grid-template-columns: 320px minmax(0,1fr) 330px; gap: 14px; height: calc(100vh - 130px); min-height: 560px; }
  @media (max-width: 1200px) { .inbox3 { grid-template-columns: 280px minmax(0,1fr); } .pane-customer { display: none; } }
  .pane { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(25,45,90,.10), 0 2px 6px rgba(25,45,90,.06); display: flex; flex-direction: column; overflow: hidden; }

  /* --- Cột trái: danh sách hội thoại --- */
  .pane-convs .p-head { padding: 14px 16px 10px; border-bottom: 1px solid #eef1f6; }
  .pane-convs .p-head h2 { margin: 0 0 10px; font-size: 17px; }
  .pane-convs select { width: 100%; margin-bottom: 8px; }
  .conv-search { position: relative; margin-bottom: 8px; }
  .conv-search input { width: 100%; padding-left: 32px; }
  .conv-search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .filter-tabs { display: flex; gap: 6px; }
  .filter-tabs button { flex: 1; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 999px; padding: 6px 4px; font-size: 12px; cursor: pointer; color: #475569; }
  .filter-tabs button.active { background: linear-gradient(135deg,#1877f2,#0d5cc0); color: #fff; border-color: transparent; font-weight: 700; box-shadow: 0 4px 10px rgba(24,119,242,.3); }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
  .conv-item { display: flex; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
  .conv-item:hover { background: #f4f8ff; transform: translateX(2px); }
  .conv-item.active { background: linear-gradient(135deg,#e8f1fe,#dbeafe); border-color: #bcd3f7; box-shadow: 0 4px 12px rgba(24,119,242,.15); }
  .conv-item .avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 17px; background: linear-gradient(135deg,#8b5cf6,#6366f1); box-shadow: 0 3px 8px rgba(99,102,241,.35); }
  .conv-item .cinfo { flex: 1; min-width: 0; }
  .conv-item .cname { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
  .conv-item .cname .dot { width: 8px; height: 8px; border-radius: 50%; background: #1877f2; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(24,119,242,.18); }
  .conv-item .snippet { font-size: 12.5px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-item.unread .cname, .conv-item.unread .snippet { font-weight: 700; color: #0f172a; }
  .conv-item .ctime { font-size: 11px; color: #94a3b8; white-space: nowrap; }
  .conv-item .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tagchip { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #4f46e5; font-weight: 600; }
  .badge-closed { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: #15803d; font-weight: 700; }

  /* --- Cột giữa: khung chat --- */
  .chat-head { padding: 12px 18px; border-bottom: 1px solid #eef1f6; display: flex; align-items: center; gap: 12px; background: linear-gradient(180deg,#fbfdff,#f4f8ff); }
  .chat-head .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 18px; background: linear-gradient(135deg,#1877f2,#0d5cc0); box-shadow: 0 4px 10px rgba(24,119,242,.35); }
  .chat-head .who { flex: 1; }
  .chat-head .who .nm { font-weight: 800; font-size: 15.5px; }
  .chat-head .who .sub { font-size: 12px; color: var(--muted); }
  .chat-head .who .sub a { color: #1877f2; text-decoration: none; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 18px; background: #eef2f7; background-image: radial-gradient(#dbe3ee 1px, transparent 1px); background-size: 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 72%; padding: 9px 13px; border-radius: 16px; font-size: 13.8px; line-height: 1.55; word-break: break-word; box-shadow: 0 2px 6px rgba(15,30,60,.08); }
  .msg.them { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: linear-gradient(135deg,#2f8cff,#1877f2); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(24,119,242,.3); }
  .msg .ts { display: block; font-size: 10.5px; opacity: .65; margin-top: 4px; }
  .msg img.att { max-width: 220px; border-radius: 10px; margin-top: 6px; display: block; cursor: zoom-in; }
  .day-sep { align-self: center; font-size: 11px; color: #94a3b8; background: #fff; padding: 3px 12px; border-radius: 999px; box-shadow: 0 1px 4px rgba(15,30,60,.08); }
  .chat-bar { padding: 10px 14px; border-top: 1px solid #eef1f6; background: #fff; }
  .chat-tools { display: flex; gap: 6px; margin-bottom: 8px; }
  .chat-inputrow { display: flex; gap: 8px; }
  .chat-inputrow input { flex: 1; border-radius: 999px; padding: 10px 16px; }
  .btn-send { border-radius: 999px; padding: 10px 22px; background: linear-gradient(135deg,#2f8cff,#1877f2); border: none; color: #fff; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(24,119,242,.35); }
  .btn-send:hover { filter: brightness(1.08); }
  .btn-send:disabled { opacity: .5; }
  .img-dropdown { position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; background: #fff; border-radius: 12px; box-shadow: 0 12px 32px rgba(15,30,60,.18); padding: 8px; display: grid; grid-template-columns: repeat(3, 84px); gap: 8px; z-index: 60; }
  .img-dropdown.hidden { display: none; }
  .img-dropdown img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .img-dropdown img:hover { border-color: #1877f2; }

  /* --- Cột phải: thông tin khách --- */
  .pane-customer .p-body { flex: 1; overflow-y: auto; padding: 16px; }
  .cust-hero { text-align: center; padding: 6px 0 14px; border-bottom: 1px solid #eef1f6; margin-bottom: 14px; }
  .cust-hero .avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 24px; background: linear-gradient(135deg,#1877f2,#7c3aed); box-shadow: 0 6px 16px rgba(24,119,242,.35); }
  .cust-hero .nm { font-weight: 800; font-size: 16px; }
  .cust-hero .ph { margin-top: 4px; }
  .cust-hero .ph a { font-size: 15px; font-weight: 800; color: #1877f2; text-decoration: none; background: #e8f1fe; padding: 4px 14px; border-radius: 999px; display: inline-block; }
  .cust-sec { margin-bottom: 16px; }
  .cust-sec h4 { margin: 0 0 8px; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; }
  .cust-sec h4 button { font-size: 11px; }
  .cust-addr { font-size: 13.5px; line-height: 1.6; background: #f8fafc; border-radius: 10px; padding: 10px 12px; }
  .order-mini { border: 1px solid #e6ebf3; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 12.5px; }
  .order-mini .ot { font-weight: 700; }
  .order-mini .st { float: right; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #4f46e5; font-weight: 700; }
  .btn-order-big { width: 100%; padding: 13px; border-radius: 12px; border: none; background: linear-gradient(135deg,#2f8cff,#1877f2); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(24,119,242,.35); margin-top: 4px; }
  .btn-order-big:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .cust-note { width: 100%; min-height: 64px; font-size: 13px; }
  .empty-pane { margin: auto; text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body data-page="inbox">
<nav class="topnav">
  <div class="brand">🛍️ ShopDesk</div>
  <div class="nav-links">
    <a href="/" data-nav="inbox">📥 Inbox</a>
    <a href="/orders" data-nav="orders">🧾 Đơn hàng</a>
    <a href="/lendon" data-nav="lendon">📝 Lên đơn</a>
    <a href="/products" data-nav="products">📦 Sản phẩm</a>
    <a href="/customers" data-nav="customers">👥 Khách hàng</a>
    <a href="/settings" data-nav="settings">⚙️ Cài đặt</a>
  </div>
</nav>

<main class="page" style="max-width:1560px">
  <div class="inbox3">
    <!-- CỘT TRÁI -->
    <aside class="pane pane-convs">
      <div class="p-head">
        <h2>💬 Hội thoại</h2>
        <select id="pageSel" title="Chọn fanpage"></select>
        <div class="conv-search"><span class="ico">🔎</span><input id="convSearch" placeholder="Tìm kiếm (F3)"></div>
        <div class="filter-tabs">
          <button data-f="" class="active">Tất cả</button>
          <button data-f="unreplied">Chưa trả lời</button>
          <button data-f="closed">Đã chốt đơn</button>
        </div>
      </div>
      <div id="convList" class="conv-list"><div class="state-loading"><span class="spinner"></span>Đang tải hội thoại…</div></div>
    </aside>

    <!-- CỘT GIỮA -->
    <section class="pane pane-chat">
      <div id="chatHead" class="chat-head"><div class="empty-pane" style="padding:8px">👈 Chọn một hội thoại ở cột bên trái để bắt đầu</div></div>
      <div id="chatMsgs" class="chat-msgs"><div class="state-empty">Chưa có tin nhắn nào.</div></div>
      <div class="chat-bar">
        <div class="chat-tools" style="position:relative">
          <div style="position:relative">
            <button id="btnImg" class="btn btn-sm" disabled>📷 Ảnh nhanh</button>
            <div id="imgDropdown" class="img-dropdown hidden"></div>
          </div>
          <button id="btnTag" class="btn btn-sm" disabled>🏷️ Tag</button>
          <button id="btnQuickOrder" class="btn btn-sm" disabled>🧾 Tạo đơn nhanh</button>
        </div>
        <div class="chat-inputrow">
          <input id="msgInput" placeholder="Nhập tin nhắn…" autocomplete="off" disabled>
          <button id="btnSend" class="btn-send" disabled>Gửi</button>
        </div>
      </div>
    </section>

    <!-- CỘT PHẢI -->
    <aside class="pane pane-customer">
      <div class="p-body" id="custBody"><div class="empty-pane">Chọn hội thoại để xem<br>thông tin khách hàng</div></div>
    </aside>
  </div>
</main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/inbox.js"></script>
</body>
</html>
