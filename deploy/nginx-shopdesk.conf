# ShopDesk — cấu hình nginx mẫu (reverse proxy)
# Cách dùng: copy file này thành /etc/nginx/sites-available/shopdesk,
# thay `shop.cuaban.com` bằng domain/IP của bạn, rồi:
#   sudo ln -s /etc/nginx/sites-available/shopdesk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # Thay bằng domain thật của bạn (hoặc bỏ dòng này nếu dùng IP)
    server_name shop.cuaban.com;

    # Giới hạn upload (gửi ảnh sản phẩm qua inbox)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}

# Sau khi chạy ổn qua HTTP, nên bật HTTPS miễn phí bằng Let's Encrypt:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d shop.cuaban.com
